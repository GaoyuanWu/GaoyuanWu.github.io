# Themed publication gallery rendered by _pages/research.html.
#
# Each theme gets a sidebar tab, a vision statement, and a list of tools.
# Papers are shown two per row as cards. Per paper:
#   id      – bib key; used as the card's anchor (/research/#<id>)
#   image   – path under assets/img/ (animated .webp/.gif or a still image)
#   image_static – optional still shown when the visitor prefers reduced motion
#   authors – plain text; "Gaoyuan Wu" is bolded automatically
#   links   – label/url pairs (e.g. Paper, arXiv, Code)

themes:
  - id: coastal-resilience
    title: Enhancing Coastal Resilience of Infrastructure
    vision: >-
      Climate change is intensifying hurricanes, storm surge, floods, and tsunamis, putting coastal bridges,
      breakwaters, and waterfront infrastructure at growing risk. My vision is to design infrastructure
      whose <em>structural shape itself</em> mitigates hazards — reducing wave loads on structures while attenuating
      waves for the communities behind them — by coupling high-fidelity fluid–structure simulation,
      physical experiments, and data-driven optimization.
    tools:
      - Smoothed Particle Hydrodynamics (SPH)
      - Finite Element Analysis
      - Multi-objective Bayesian Optimization
      - Wave-flume experiments
      - Neural-network surrogates
    papers:
